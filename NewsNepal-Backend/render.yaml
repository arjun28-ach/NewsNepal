services:
  - type: web
    name: newsnepal-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn newsnepal.wsgi:application --workers 1 --timeout 120 --graceful-timeout 30 --keep-alive 5"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: FRONTEND_ORIGINS
        value: "http://localhost:5173"
      - key: ENABLE_ARTICLE_METADATA
        value: "False"
      - key: NEWS_REQUEST_TIMEOUT
        value: "4"
      - key: NEWS_SOURCE_WORKERS
        value: "8"
      - key: DATABASE_URL
        fromDatabase:
          name: newsnepal-db
          property: connectionString

databases:
  - name: newsnepal-db
    plan: free
